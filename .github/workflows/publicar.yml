# Publica o site no GitHub Pages a cada push (e pelo botão "Run workflow").
name: Publicar site

on:
  push:
    branches: [main, claude/focused-ptolemy-1qc5ss]
  workflow_dispatch:

permissions:
  contents: write # para guardar as fotos provisórias baixadas
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Baixar fotos provisórias que faltam (Unsplash)
        run: npm run fotos
        continue-on-error: true
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Guardar fotos baixadas no repositório
        continue-on-error: true
        run: |
          git add public/fotos src/data/creditos-fotos.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fotos provisórias do Unsplash"
            git push
          fi

      - uses: actions/configure-pages@v5

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
